name: DULMS Checker

on:
  schedule:
    - cron: "*/5 * * * *"      # احتياطي بس: بيرجّع السلسلة لو وقفت (GitHub بيبطّئ الـ cron)
  workflow_dispatch:
    inputs:
      force_send:
        description: "ابعت حتى لو مفيش جديد (للتجربة)"
        default: "false"

permissions:
  contents: write    # علشان يحفظ state.json
  actions: write     # علشان الـ workflow يشغّل نفسه تاني

concurrency:
  group: dulms-checker
  cancel-in-progress: false    # مفيش تشغيلين مع بعض

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # أقل من حد GitHub (360 دقيقة)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          playwright install --with-deps chromium

      - name: Run bot every 1 minute (about 5.5 hours)
        env:
          DULMS_USER: ${{ secrets.DULMS_USER }}
          DULMS_PASS: ${{ secrets.DULMS_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRST_FORCE_SEND: ${{ github.event.inputs.force_send || 'false' }}
        run: |
          git config user.name "dulms-bot"
          git config user.email "bot@users.noreply.github.com"
          LOOP_SECONDS=19800     # 5.5 ساعة
          INTERVAL=60            # دقيقة
          START=$(date +%s)
          FORCE="$FIRST_FORCE_SEND"
          while true; do
            PASS_START=$(date +%s)
            # الفحص الواحد ميزيدش عن 8 دقايق. الفشل مش بيوقف اللوب (bot.py بيعد الفشلات ويبعت التنبيه بنفسه)
            FORCE_SEND="$FORCE" timeout 8m python bot.py || echo "pass failed or timed out"
            FORCE=false

            # حفظ state.json بعد كل فحص لو اتغير
            git add state.json || true
            if ! git diff --staged --quiet; then
              git commit -m "update state"
              git push || { git pull --rebase && git push; } || echo "push failed, will retry next pass"
            fi

            NOW=$(date +%s)
            if [ $((NOW - START + INTERVAL)) -ge $LOOP_SECONDS ]; then
              break
            fi
            SLEEP=$((INTERVAL - (NOW - PASS_START)))
            if [ "$SLEEP" -gt 0 ]; then sleep "$SLEEP"; fi
          done

      - name: Save state (safety net)
        if: always()
        run: |
          git config user.name "dulms-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || (git commit -m "update state" && (git push || (git pull --rebase && git push)))

      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref "${{ github.ref_name }}"
